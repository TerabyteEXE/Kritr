appId: com.terabyteexe.kritr
productName: Kritr
copyright: Copyright © 2026 TerabyteEXE
directories:
  output: dist
files:
  - index.html
  - css/**/*
  - js/**/*
  - assets/**/*
  - electron/**/*
  - package.json
asar: true
win:
  target:
    - target: nsis
      arch:
        - x64
  icon: assets/icons/kritr.ico
  artifactName: Kritr-Setup-${version}.${ext}
  fileAssociations:
    - ext: [mp3, wav, flac, ogg, m4a, aac, opus]
      name: Audio File
      role: Viewer
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Kritr
  runAfterFinish: true
  deleteAppDataOnUninstall: false
portable:
  artifactName: Kritr-Portable-${version}.${ext}
